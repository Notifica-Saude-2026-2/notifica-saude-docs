name: Publicar site

on:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs gh-deploy --force -f docs/mkdocs.yml