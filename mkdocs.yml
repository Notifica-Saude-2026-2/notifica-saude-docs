site_name: NotificaSaúde
site_description: Documentação do NotificaSaúde — registro, análise e acompanhamento de incidentes de segurança do paciente.
repo_url: https://github.com/Notifica-Saude-2026-2/notifica-saude-docs
repo_name: Notifica-Saude-2026-2/notifica-saude-docs

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  logo: assets/favicon.png
  favicon: assets/favicon.png
  # Fonte principal dos textos: Inter. A fonte de destaque (Raleway, a mesma da marca
  # no sistema) é usada só nos títulos principais — ver docs/stylesheets/extra.css.
  font:
    text: Inter
    code: JetBrains Mono
  # Modo claro é o padrão (primeira paleta). O usuário pode alternar para o escuro,
  # e a escolha fica salva no navegador.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  # nl2br: uma quebra de linha simples no Markdown vira quebra de linha na página
  # (como no GitHub). Os documentos são escritos assim — ex.: título do critério de
  # aceite numa linha e "Dado que... quando... então..." na linha seguinte.
  - nl2br
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - git-revision-date-localized:
      type: datetime
      timezone: America/Campo_Grande
      locale: pt
      fallback_to_build_date: true

extra_css:
  - stylesheets/extra.css

