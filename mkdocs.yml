site_name: NotificaSaúde
site_description: Documentação do NotificaSaúde — registro, análise e acompanhamento de incidentes de segurança do paciente.
repo_url: https://github.com/Notifica-Saude-2026-2/notifica-saude-docs
repo_name: Notifica-Saude-2026-2/notifica-saude-docs

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  logo: assets/favicon.png
  favicon: assets/favicon.png
  # Fonte principal dos textos: Inter. A fonte de destaque (Raleway, a mesma da marca
  # no sistema) é usada só nos títulos principais — ver docs/stylesheets/extra.css.
  font:
    text: Inter
    code: JetBrains Mono
  # Modo claro é o padrão (primeira paleta). O usuário pode alternar para o escuro,
  # e a escolha fica salva no navegador.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  # nl2br: uma quebra de linha simples no Markdown vira quebra de linha na página
  # (como no GitHub). Os documentos são escritos assim — ex.: título do critério de
  # aceite numa linha e "Dado que... quando... então..." na linha seguinte.
  - nl2br
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - git-revision-date-localized:
      type: datetime
      timezone: America/Campo_Grande
      locale: pt
      fallback_to_build_date: true

extra_css:
  - stylesheets/extra.css

nav:
  - Visão Geral:
      - Início: index.md
      - Manual do Sistema: manual-sistema/index.md
  - Descoberta do Produto:
      - Visão geral: descoberta-produto/index.md
      - Entrevistas e Formulários: descoberta-produto/entrevistas-e-formularios.md
      - Mapeamento de Processos: descoberta-produto/mapeamento-processos.md
  - Requisitos e Arquitetura:
      - Requisitos:
          - Especificação de Requisitos de Software: requisitos/especificacao-requisitos.md
          - Matriz RBAC: requisitos/matriz-rbac.md
      - Arquitetura:
          - Especificação de Arquitetura de Software: arquitetura/especificacao-arquitetura.md
          - ADR: arquitetura/adr.md
          - Brevo: arquitetura/brevo.md
      - Banco de Dados:
          - Especificação do Modelo de Domínio: arquitetura/modelo-dominio.md
          - Especificação do Modelo Lógico: arquitetura/modelo-logico.md
  - Qualidade e Testes:
      - Visão geral: vvt/index.md
      - Plano de Testes: vvt/plano-de-testes.md
      - Casos de Teste: vvt/casos-de-teste.md
      - Matriz de Rastreabilidade: vvt/matriz-rastreabilidade.md
      - Relatórios: vvt/relatorios.md
      - Uso do SonarCloud: vvt/sonarcloud.md
      - Teste de Usabilidade: teste-usabilidade/index.md
  - Gerência de Configuração:
      - Visão geral: gcs/index.md
      - Modelo de Ramificação: gcs/modelo-ramificacao.md
      - Gerenciamento de Mudanças: gcs/gerenciamento-mudancas.md
      - Gerenciamento de Pull Requests: gcs/pull-requests.md
      - Padrão de Mensagens de Commit: gcs/padrao-commits.md
      - Gerenciamento de Documentação: gcs/gerenciamento-documentacao.md
      - Definição de Pronto (DoD e DoR): gcs/definicao-de-pronto.md
      - Gerenciamento de Releases: gcs/gerenciamento-releases.md
      - Pipelines de CI: gcs/pipelines-ci.md
      - Uso do act (Execução Local da CI): gcs/uso-act.md
  - Gestão do Projeto:
      - Visão geral: gerencia-projeto/index.md
      - Sprints: sprints/index.md
      - Plano, Riscos e Decisões: gerencia-projeto/plano-riscos-decisoes.md
      - Atas de Reunião: gerencia-projeto/atas-de-reuniao.md
      - Registros de Uso de IA: registros-ia/index.md
      - Uso do MkDocs:
          - Visão geral: uso-mkdocs/index.md
          - Decisão da Ferramenta: uso-mkdocs/decisao-da-ferramenta.md
          - Configuração e Manutenção: uso-mkdocs/configuracao-e-manutencao.md
  - Implantação e Entregas:
      - Implantação: implantacao/index.md
      - Guia de Ambiente — Frontend: implantacao/guia-ambiente-frontend.md
      - Apresentações NES: entregas-nes/index.md
